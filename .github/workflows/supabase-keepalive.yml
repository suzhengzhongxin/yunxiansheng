name: Supabase志愿者平台保活

on:
  schedule:
    - cron: '0 0 */3 * *'

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 访问Supabase班级表保活
        uses: fjogeleit/http-request-action@v1.15.0
        with:
          url: 'https://vpgtpdniqyalolzjfxha.supabase.co/rest/v1/classes?select=id&limit=1'
          method: 'GET'
          customHeaders: '{"apikey": "${{ secrets.SUPABASE_API_KEY }}", "Authorization": "Bearer ${{ secrets.SUPABASE_API_KEY }}"}'
 
